[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "legal-rag-evaluation"
version = "0.1.0"
description = "Reproducible research tooling for Vietnamese ESG legal RAG"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
retrieval = ["llama-index-core==0.14.23", "llama-index-embeddings-huggingface==0.7.0"]

[project.scripts]
legal-rag = "legal_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
